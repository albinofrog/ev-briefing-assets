<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EV 시장·정책 브리핑 {{YYYY-MM-DD}}</title>
<link rel="preload" as="image" href="file:///tmp/ev_fonts/bonce.png">
<style>
@font-face{font-family:"EVLatin";src:url("file:///tmp/ev_fonts/archivonarrow.woff2") format("woff2"),url("https://raw.githubusercontent.com/albinofrog/ev-briefing-assets/main/fonts/archivonarrow.woff2") format("woff2");font-weight:100 900;unicode-range:U+0000-024F,U+2000-206F,U+20A0-20CF,U+2100-214F,U+2190-21FF}
@font-face{font-family:"EVKorean";src:url("file:///tmp/ev_fonts/lgsmart.woff2") format("woff2"),url("https://raw.githubusercontent.com/albinofrog/ev-briefing-assets/main/fonts/lgsmart.woff2") format("woff2");font-weight:400;unicode-range:U+1100-11FF,U+3000-303F,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF}
@page{size:A4;margin:20mm 16mm 18mm;
  @top-left{content:"EV 시장·정책 브리핑";width:34.6mm;padding-left:17.4mm;background:url("file:///tmp/ev_fonts/bonce.png");background-repeat:no-repeat;background-position:left 0 bottom 2.6mm;background-size:auto 3mm;white-space:nowrap;font-size:8pt;font-weight:700;font-family:"EVLatin","EVKorean",sans-serif;color:#1F6E80;vertical-align:bottom;padding-bottom:2.2mm;border-bottom:.8mm solid #3EC2CF;margin-bottom:4mm}
  @top-right{content:"제{{NNN}}호   {{YYYY-MM-DD}}";width:126mm;text-align:right;font-size:8pt;font-family:"EVLatin","EVKorean",sans-serif;color:#636967;vertical-align:bottom;padding-bottom:2.75mm;border-bottom:.25mm solid #DDE0DF;margin-bottom:4mm}
  @bottom-left{content:"EV 시장·정책 브리핑  제{{NNN}}호  {{YYYY-MM-DD}}";width:150mm;font-size:7.4pt;font-family:"EVLatin","EVKorean",sans-serif;color:#636967;vertical-align:top;padding-top:2.55mm;border-top:.25mm solid #DDE0DF;margin-top:4mm}
  @bottom-right{content:counter(page) " / " counter(pages);width:28mm;text-align:right;font-size:8pt;font-weight:700;font-family:"EVLatin","EVKorean",sans-serif;color:#1F6E80;vertical-align:top;padding-top:2mm;border-top:.8mm solid #3EC2CF;margin-top:4mm}}
@page:first{margin-top:14mm;@top-left{content:none;border:0}@top-right{content:none;border:0}}
:root{--ink:#1F1F1F;--body:#3A3E3D;--muted:#636967;--cyan:#24C0EB;--bright:#3EC2CF;--deep:#1F6E80;--tint:#DEF2F7;--mid:#A8E8EC;--panel:#F1F1F1;--soft:#EBEEED;--line:#DDE0DF;--sec:#554596;--sec-tint:#ECE8F6;--r:1.6mm;--f:"EVLatin","EVKorean","Noto Sans CJK KR","Noto Sans CJK SC","Noto Sans CJK JP",sans-serif}
*{box-sizing:border-box}html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;color:var(--body);background:#fff;font-family:var(--f);font-size:9.4pt;line-height:1.62;word-break:keep-all;overflow-wrap:anywhere;orphans:3;widows:3;font-variant-numeric:tabular-nums}
a{color:var(--deep);text-decoration:none}
h1,h2,h3,h4{color:var(--ink);font-weight:700}
.mast{display:grid;grid-template-columns:1fr auto;column-gap:8mm;align-items:stretch}
.mast>div{position:relative;padding:5mm 0 4mm 6mm}
.mast>div::before{content:"";position:absolute;left:0;top:5mm;bottom:4mm;width:1.6mm;background:var(--cyan);border-radius:.8mm}
.mast h1{font-size:24pt;margin:0;line-height:1.1;letter-spacing:-.01em}
.mast .logo{display:block;height:4.6mm;width:auto;margin:0 0 2.4mm}
.mast .sub{font-size:8.6pt;color:var(--muted);margin-top:2mm}
.mast dl{margin:0;display:grid;grid-template-columns:auto auto;align-content:center;gap:.6mm 5mm;font-size:8.2pt;line-height:1.45;white-space:nowrap;background:var(--tint);border-radius:var(--r);padding:3mm 4mm}
.mast dt{color:var(--deep)}.mast dd{margin:0;text-align:right;color:var(--ink)}
.box{margin-top:6mm;break-inside:avoid;background:var(--tint);border-radius:var(--r);padding:4.5mm 5mm 4mm}
.box h2{font-size:13.5pt;margin:0 0 3mm;color:var(--ink);display:flex;align-items:center;gap:2mm}
.key{display:grid;grid-template-columns:9mm 1fr auto;column-gap:3mm;align-items:start;padding:2.6mm 3mm;margin-bottom:1.6mm;background:#fff;border-radius:var(--r)}
.key .n{grid-row:1 / span 2;width:8mm;height:8mm;border-radius:50%;background:var(--cyan);color:#fff;font-size:13pt;line-height:8mm;text-align:center;font-weight:700}
.key .h{font-size:11.4pt;line-height:1.42;color:var(--ink);font-weight:700;padding-top:.3mm}
.key .h a{color:inherit}
.key .s{font-size:8pt;color:var(--deep);background:var(--tint);border-radius:9mm;padding:.2mm 2mm .2mm .4mm;white-space:nowrap;margin-top:.8mm}
.axn{display:inline-block;width:4.2mm;height:4.2mm;margin-right:1mm;border-radius:1mm;background:var(--cyan);color:#fff;font-size:8pt;font-weight:700;line-height:4.2mm;text-align:center;vertical-align:middle}
.box>.none{padding:2.6mm 3mm;background:#fff;border-radius:var(--r)}
.counts{width:100%;border-collapse:separate;border-spacing:1.2mm;margin:2mm -1.2mm 0;width:calc(100% + 2.4mm);font-size:8pt;table-layout:fixed}
.counts th,.counts td{padding:1.2mm 1.5mm;text-align:center;border-radius:1mm}
.counts thead th{color:var(--deep);font-weight:400;line-height:1.35;vertical-align:bottom;padding-bottom:.4mm}
.counts thead th:first-child,.counts tbody th{text-align:left;width:17mm;color:var(--deep);font-weight:400}
.counts td{font-size:9pt;color:var(--ink);background:#fff;font-weight:700}
.counts td.z{color:var(--muted);background:#fff;font-weight:400}
.counts td.sum,.counts th.sum{font-weight:700}
.counts td.sum{background:var(--mid);color:var(--ink)}
section{margin-top:6mm}
section:not(.empty)>h2{padding-top:6mm;background:linear-gradient(var(--bright),var(--bright)) 0 0/24mm .8mm no-repeat,linear-gradient(var(--line),var(--line)) 0 0/100% .25mm no-repeat}
section>h2{display:flex;align-items:center;font-size:15pt;margin:0 0 4mm;break-after:avoid;page-break-after:avoid}
section>h2 .ax{flex:none;width:8mm;height:8mm;margin-right:2.5mm;border-radius:var(--r);background:var(--cyan);color:#fff;font-size:13pt;font-weight:700;line-height:8mm;text-align:center}
section>h2 .cnt{margin-left:auto;font-size:8.5pt;font-weight:400;color:var(--deep);background:var(--tint);border-radius:9mm;padding:.4mm 2.4mm;white-space:nowrap}
section.empty{margin-top:2.5mm}
section.empty>h2{font-size:10pt;font-weight:400;color:var(--muted);margin:0;padding:1.4mm 2mm;background:var(--soft);border-radius:var(--r)}
section.empty>h2 .ax{width:5.5mm;height:5.5mm;line-height:5.5mm;font-size:8.5pt;background:var(--line);color:var(--body);border-radius:1mm}
section.empty>h2 .cnt{background:none;color:var(--muted)}
section.empty>h2 .ax:has(+ .ax){margin-right:1mm}
.item{margin-bottom:4mm;padding-bottom:5.2mm;background:linear-gradient(var(--panel),var(--panel)) 0 100%/100% 1.2mm no-repeat;break-inside:avoid-page}
.item:last-child{background:none;padding-bottom:0}
.item h3{font-size:12pt;margin:0 0 1mm;line-height:1.38;break-after:avoid}
.item .orig{font-size:8.3pt;color:var(--muted);margin:0 0 2.2mm;line-height:1.4}
.item .sum{margin:0;padding:0;list-style:none}
.item .sum li{position:relative;padding-left:4mm;margin-bottom:1.2mm}
.item .sum li:last-child{margin-bottom:0}
.item .sum li::before{content:"";position:absolute;left:.3mm;top:.52em;width:1.8mm;height:1.8mm;border-radius:50%;background:var(--bright)}
.item .src{font-size:8.3pt;color:var(--muted);margin-top:2mm;line-height:1.5}
h4.tier{display:block;width:fit-content;font-size:8.5pt;color:var(--sec);background:var(--sec-tint);border-radius:9mm;padding:.2mm 2.6mm;margin:0 0 2mm;font-weight:700;break-after:avoid;page-break-after:avoid}
.ref{font-size:8.6pt;line-height:1.5;padding:2.2mm 3mm 2.2mm 3.8mm;margin-bottom:1.2mm;background:var(--panel);box-shadow:inset .8mm 0 0 var(--sec);border-radius:var(--r);break-inside:avoid}
.ref .t{display:block;font-size:9.4pt;font-weight:700;color:var(--ink);margin-bottom:.4mm}
.none{color:var(--muted);margin:0 0 2mm;font-size:8.8pt}
section.srcs>h2{font-size:11pt}
.sources{font-size:7.9pt;line-height:1.45;padding-left:5mm;margin:0;columns:2;column-gap:8mm;color:var(--body)}
.sources li{margin-bottom:1.2mm;break-inside:avoid}
.sources li::marker{color:var(--deep)}
section>p.none{break-after:avoid}.key,.counts{break-inside:avoid}
.item h3,.key .h{text-wrap:balance}
.nw,.sources .back{white-space:nowrap}
@media screen{body{max-width:178mm;margin:12mm auto;padding:0 4mm}}
@media screen and (max-width:640px){
  body{margin:0 auto;padding:4mm 4mm 10mm;font-size:15px}
  .mast{grid-template-columns:1fr;row-gap:3mm}.mast h1{font-size:26px}.mast dl{white-space:normal}
  .box{padding:4mm 3mm}.key{grid-template-columns:30px 1fr;padding:3mm}.key .n{width:26px;height:26px;line-height:26px;font-size:14px}
  .key .h{grid-row:1}.key .kv{grid-column:2;grid-row:2}.key .s{grid-column:2;grid-row:3;justify-self:start;margin-top:1.5mm}
  .counts{table-layout:auto}.counts thead th{font-size:11px;word-break:keep-all;overflow-wrap:normal}.counts th.sum{white-space:nowrap}
  .counts{display:block;overflow-x:auto;margin:2mm 0 0;width:100%}
  .item{display:flex;flex-direction:column}
  .item h3{order:1}.item .orig{order:2}.item .sum{order:5}.item .src{order:6}
  .sources{columns:1}
  .item .orig,.item .src,h4.tier,.key .s,section>h2 .cnt,.mast .sub,.mast dl,.sources{font-size:12px}
  .axn{font-size:12px}.mast .logo{height:20px}
  .ref{font-size:14px}.ref .t{font-size:15px}
}
/* 출처 줄: 매체 링크 + 도메인 + 게재 시각(KST, 현지 괄호) */
.srcl{font-size:8.3pt;color:var(--muted);line-height:1.55}
.srcl a.out{color:var(--deep);font-weight:700;border-bottom:.2mm solid var(--mid)}
.srcl .dom{color:var(--muted)}
.srcl .lb{color:var(--ink)}
.srcl .olab{display:inline-block;font-size:7.6pt;color:var(--deep);background:var(--tint);border-radius:1mm;padding:0 1.4mm;margin-right:1mm}
.fnr{font-size:7.4pt;color:var(--deep);background:var(--tint);border-radius:1mm;padding:0 1.2mm;margin-left:1mm;vertical-align:.1em}
.item .src{margin-top:2.4mm}
.item .src .srcl+.srcl{margin-top:.6mm}
/* 참고 카드: 원제 줄, 본문 미확인이면 요약 없이 원제만 */
.ref .rs{display:block}
.ref .ot{display:block;font-size:8.3pt;color:var(--muted);margin:.2mm 0 .8mm}
.ref .ot .lb{color:var(--ink)}
/* 요약 속 숫자 굵게 */
.item .sum b.n{font-weight:700;color:var(--ink)}
/* 오늘의 핵심: 매체·도메인·게재 시각 */
.key .kv{grid-column:2 / span 2;display:flex;flex-wrap:wrap;align-items:center;gap:1mm 2mm;margin-top:1.2mm}
.key .kv .srcl{font-size:8.3pt}
/* 출처 목록: 제목 링크 + 도메인, 원출처 라벨, 본문 복귀 */
.sources a{display:inline;word-break:normal}
.sources .st{color:var(--deep)}
.sources .dom{color:var(--muted)}
.sources .back{font-size:7.4pt;color:var(--deep);background:var(--tint);border-radius:1mm;padding:0 1.2mm;margin-left:1mm;white-space:nowrap}
.sources .olab{font-size:7.4pt;color:#fff;background:var(--deep);border-radius:1mm;padding:0 1.2mm;margin-right:1mm}
/* 끝줄 고아 단어 방지: 모든 문장 블록에 pretty, 빌드에서 마지막 두 어절은 U+00A0으로 묶음 */
.item .sum li,.item .orig,.ref .rs,.ref .t,.ref .ot,.sources li{text-wrap:pretty}
@media screen and (max-width:640px){.srcl,.fnr,.ref .ot,.sources .back,.sources .olab{font-size:12px}}
</style>
</head>
<body>
<!-- 본문은 build.py가 이 파일의 <head>(스타일)와 <script>를 가져와 직접 만듭니다. 디자인은 <style>에서 수정합니다. -->
<script>
(function(){
  var PDF=location.hash==="#pdf";
  if(PDF){var st=document.createElement("style");st.textContent="body{max-width:none!important;width:178mm;margin:0!important;padding:0!important}";document.head.appendChild(st)}
  function h(el){return el.getBoundingClientRect().height}
  function fit(){
    document.querySelectorAll(".item h3,.key .h").forEach(function(el){
      var lh=parseFloat(getComputedStyle(el).lineHeight)||12,base=h(el);
      if(base<lh*1.8)return;
      for(var s=1;s<=3;s++){el.style.letterSpacing=(-0.004*s)+"em";el.style.wordSpacing=(-0.008*s)+"em";if(h(el)<base-lh*0.5)return}
      el.style.letterSpacing="";el.style.wordSpacing="";
    });
  }
  // 끝줄 검사: 마지막 줄 폭이 블록 폭의 22% 미만이면 자간·어간을 최대 3단계 줄여 앞줄로 붙임
  function lastLineRatio(el){
    var r=document.createRange();r.selectNodeContents(el);var rs=[].slice.call(r.getClientRects()).filter(function(x){return x.width>0});
    if(rs.length<2)return 1;var lt=rs[rs.length-1].top,w=0;
    rs.forEach(function(x){if(Math.abs(x.top-lt)<2)w+=x.width});
    var top0=rs[0].top;if(Math.abs(top0-lt)<2)return 1;
    return w/el.getBoundingClientRect().width;
  }
  function orphan(){
    document.querySelectorAll(".item .sum li,.item .orig,.ref .ot,.ref .rs,.ref .t,.key .h,.item h3").forEach(function(el){
      if(lastLineRatio(el)>=0.22)return;
      var base=h(el);
      for(var s=1;s<=3;s++){el.style.letterSpacing=(-0.006*s)+"em";el.style.wordSpacing=(-0.02*s)+"em";if(h(el)<base-1)return}
      el.style.letterSpacing="";el.style.wordSpacing="";
    });
  }
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){fit();orphan()});
})();
</script>
</body>
</html>
