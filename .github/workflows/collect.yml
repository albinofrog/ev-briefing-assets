name: collect
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [collect.py, sources.md, watchlist.md, .github/workflows/collect.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q feedparser==6.0.11 requests==2.32.3
      - name: 이전 데이터 받기(있는데 못 받으면 중단해 이력 초기화 방지)
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q origin data
            git show FETCH_HEAD:items.jsonl > out/items.jsonl
            git show FETCH_HEAD:status.json > out/status_prev.json
          fi
      - run: python collect.py out
      - name: data 브랜치에 저장
        run: |
          cd out
          rm -f status_prev.json
          git init -q -b data
          git add items.jsonl status.json
          git -c user.name=collector -c user.email=collector@users.noreply.github.com commit -q -m "collect $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
      - name: 주 1회 예약 유지(60일 비활동 비활성화 방지)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u%H)" = "100" ]; then
            curl -sS -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
          fi
