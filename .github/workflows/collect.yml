name: collect
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [collect.py, sources.md, watchlist.md, .github/workflows/collect.yml]
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q feedparser requests
      - name: 이전 데이터 받기
        run: |
          mkdir -p out
          if git fetch -q origin data; then
            git show FETCH_HEAD:items.jsonl > out/items.jsonl || true
          fi
      - run: python collect.py out
      - name: data 브랜치에 저장
        run: |
          cd out
          git init -q -b data
          git add items.jsonl status.json
          git -c user.name=collector -c user.email=collector@users.noreply.github.com commit -q -m "collect $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
